name: Bug report
description: Something in Pathsta does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Finder window
        2. Click the path bar
        3. ...
  - type: input
    id: pathsta-version
    attributes:
      label: Pathsta version
      description: Shown in the Pathsta menu-bar menu under About Pathsta.
      placeholder: 1.0.2
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 27.0
    validations:
      required: true
