name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Xcode 27 app and release dry run
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          [[ "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" == 27.* ]]

      - name: Install development tools
        run: brew bundle

      - name: Verify project and distribution package
        run: make ci

  core-sonoma:
    name: Core tests on macOS 14
    runs-on: macos-14
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run core tests
        run: |
          set -euo pipefail
          [[ "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" == "16.2" ]]
          swift test --parallel
