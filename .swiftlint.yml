included:
  - Sources
  - Tests

# swift-format is authoritative for these whitespace choices.
disabled_rules:
  - closure_parameter_position
  - opening_brace
  - trailing_comma

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - convenience_type
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - identical_operands
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_key_path
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 500

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 60
  error: 90

cyclomatic_complexity:
  warning: 10
  error: 15

reporter: xcode
