name: Pathsta
options:
  bundleIdPrefix: ch.codevs
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  xcodeVersion: "27.0"

configs:
  Debug: debug
  Release: release

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_COMPILATION_MODE: wholemodule
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: "6.0"

targets:
  PathstaCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/PathstaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.codevs.pathsta.core
        PRODUCT_MODULE_NAME: PathstaCore
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: NO

  Pathsta:
    type: application
    platform: macOS
    sources:
      - Sources/Pathsta
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Brand/PathstaAppIcon.icon
        buildPhase: resources
    dependencies:
      - target: PathstaCore
      - package: Sparkle
    entitlements:
      path: Resources/Pathsta.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Pathsta
        CFBundleName: Pathsta
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSAppleEventsUsageDescription: Pathsta reads and changes the folder shown by the active Finder window.
        NSHumanReadableCopyright: Copyright © 2026 Elwan Mayencourt. All rights reserved.
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
        SUEnableAutomaticChecks: false
        SUFeedURL: https://github.com/elwan-l1/pathsta/releases/latest/download/appcast.xml
        SUPublicEDKey: 9TznX86q/BzyskCGcSxaOpXPIq5bE77bD/5f0Ji+vM4=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: PathstaAppIcon
        AUTOMATION_APPLE_EVENTS: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: K85JVL5Z98
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.1
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        PRODUCT_BUNDLE_IDENTIFIER: ch.codevs.pathsta
        PRODUCT_MODULE_NAME: Pathsta
        PRODUCT_NAME: Pathsta

  PathstaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PathstaTests
    dependencies:
      - target: PathstaCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.codevs.pathsta.tests
        PRODUCT_MODULE_NAME: PathstaTests
        SWIFT_COMPILATION_MODE: singlefile

  PathstaAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PathstaAppTests
    dependencies:
      - target: Pathsta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        PRODUCT_BUNDLE_IDENTIFIER: ch.codevs.pathsta.app-tests
        PRODUCT_MODULE_NAME: PathstaAppTests
        SWIFT_COMPILATION_MODE: singlefile

schemes:
  Pathsta:
    build:
      targets:
        Pathsta: all
        PathstaCore: all
        PathstaAppTests: [test]
        PathstaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PathstaAppTests
        - PathstaTests
    archive:
      config: Release
